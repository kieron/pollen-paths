<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pollen Paths</title>
    <meta name="description" content="A cozy bee-colony roguelite. Plant flowers, grow hives and stockpile honey before winter." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐝</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app">
      <header id="hud">
        <div class="brand">🐝 Pollen Paths</div>
        <div class="stat" title="Honey: spend it on plants and hives, and save enough for winter">🍯 <b id="hud-honey">0</b><small>honey</small></div>
        <div class="stat" title="Bees / total hive capacity">🐝 <b id="hud-bees">0</b><small>bees</small></div>
        <div class="stat winter" id="hud-winter">❄️ <b id="hud-need">0</b><small>needed for winter</small></div>
        <div class="season">
          <div class="season-top"><span id="hud-season">Year 1 · Spring</span><span id="hud-time"></span></div>
          <div class="bar"><div id="hud-bar"></div></div>
        </div>
        <div class="weather" id="hud-weather"></div>
        <div class="speed">
          <button data-speed="0" title="Pause (Space)">⏸</button>
          <button data-speed="1" title="Normal speed">▶</button>
          <button data-speed="2" title="Fast (F)">⏩</button>
          <button data-speed="3" title="Fastest (F)">⏭</button>
        </div>
      </header>
      <main id="stage">
        <canvas id="game"></canvas>
        <div id="toasts"></div>
        <div id="paused-badge">Paused, but you can still plant</div>
      </main>
      <footer id="toolbar">
        <div id="tools"></div>
        <div id="tool-info"></div>
      </footer>
    </div>
    <div id="modal" class="hidden"><div id="panel" class="panel"></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
